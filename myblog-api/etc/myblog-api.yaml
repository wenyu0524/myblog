Name: myblog-api
Host: 0.0.0.0
Port: 8888

# ── 限制 ──────────────────────────────────────────────────────────────────
MaxConns: 10000               # 最大并发连接数
MaxBytes: 1048576             # 最大请求体字节数（默认：1MB）
Timeout: 3000                 # 请求超时，毫秒（默认：3000）
CpuThreshold: 900             # CPU % * 10，用于负载卸除（默认：900 = 90%）

# ── 接口限流（每个客户端每分钟） ─────────────────────────────────────────
RateLimit:
  UserPerMinute: 60           # 公开资料和管理员用户接口
  LoginPerMinute: 5           # 登录接口，按 IP + 用户名
  BlogPerMinute: 60           # 博客读写接口，按 IP；管理接口额外按用户
  UploadPerMinute: 20         # 图片上传接口，按 IP + 用户

# ── 认证 ──────────────────────────────────────────────────────────────────
Auth:
  AccessSecret: "my-blog-secret-key-2026"
  AccessExpire: 86400        # 86400 = 24h，单位秒

# ── 用户 RPC ──────────────────────────────────────────────────────────────
UserRpc:
  Etcd:
    Hosts:
      - etcd:2379
    Key: user.rpc
  Timeout: 2000               # 客户端 deadline，毫秒
  KeepaliveTime: 20s          # keepalive ping 间隔

# ── 博客 RPC ──────────────────────────────────────────────────────────────
BlogRpc:
  Etcd:
    Hosts:
      - etcd:2379
    Key: blog.rpc
  Timeout: 2000               # 客户端 deadline，毫秒
  KeepaliveTime: 20s          # keepalive ping 间隔

# ── 日志 ──────────────────────────────────────────────────────────────────
Log:
  ServiceName: myblog-api
  Mode: file               # console | file | volume
  Level: info                 # debug | info | error
  Encoding: json              # json | plain
  KeepDays: 7
  Compress: false
