Name: blog.rpc
ListenOn: 0.0.0.0:8081

# ── 服务发现 ──────────────────────────────────────────────────────────
Etcd:
  Hosts:
  - etcd:2379
  Key: blog.rpc

# ── 数据源 ─────────────────────────────────────────────────────────────
DB:
  DataSource: "postgres://postgres:postgres@postgres:5432/blog_db?sslmode=disable"
  DriverName: pgx
  Weight: 100

Cache:
  - Host: redis:6379
    Type: node
