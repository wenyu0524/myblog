syntax = "proto3";

package blog;

option go_package = "./blog";

service Blog {
  rpc ListPublicPosts(ListPostsRequest) returns (ListPublicPostsResponse);
  rpc GetPublicPost(GetPostRequest) returns (PublicPostResponse);
  rpc ListCategories(Empty) returns (ListCategoriesResponse);

  rpc ListAdminPosts(ListPostsRequest) returns (ListAdminPostsResponse);
  rpc GetAdminPost(GetPostRequest) returns (AdminPostResponse);
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  rpc UpdatePost(UpdatePostRequest) returns (EmptyResponse);
  rpc DeletePost(DeletePostRequest) returns (EmptyResponse);

  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (EmptyResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (EmptyResponse);

  rpc UploadImage(UploadImageRequest) returns (UploadImageResponse);
}

message Empty {}

message EmptyResponse {}

message ListPostsRequest {
  int64 page = 1;
  int64 page_size = 2;
  string category = 3;
  string keyword = 4;
}

message GetPostRequest {
  int64 id = 1;
}

message DeletePostRequest {
  int64 id = 1;
  int64 user_id = 2;
}

message PublicPostItem {
  int64 id = 1;
  string title = 2;
  string slug = 3;
  string summary = 4;
  string cover = 5;
  int64 category_id = 6;
  string category_name = 7;
  int64 published_at = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}

message AdminPostItem {
  int64 id = 1;
  string title = 2;
  string slug = 3;
  string summary = 4;
  string cover = 5;
  string status = 6;
  int64 category_id = 7;
  string category_name = 8;
  int64 view_count = 9;
  int64 published_at = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
}

message ListPublicPostsResponse {
  int64 total = 1;
  repeated PublicPostItem posts = 2;
}

message ListAdminPostsResponse {
  int64 total = 1;
  repeated AdminPostItem posts = 2;
}

message PublicPostResponse {
  int64 id = 1;
  string title = 2;
  string slug = 3;
  string summary = 4;
  string content = 5;
  string cover = 6;
  int64 category_id = 7;
  string category_name = 8;
  int64 published_at = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

message AdminPostResponse {
  int64 id = 1;
  string title = 2;
  string slug = 3;
  string summary = 4;
  string content = 5;
  string cover = 6;
  string status = 7;
  int64 category_id = 8;
  string category_name = 9;
  int64 view_count = 10;
  int64 published_at = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
}

message CreatePostRequest {
  int64 user_id = 1;
  string title = 2;
  string slug = 3;
  string summary = 4;
  string content = 5;
  string cover = 6;
  string status = 7;
  int64 category_id = 8;
  int64 published_at = 9;
}

message CreatePostResponse {
  int64 id = 1;
}

message UpdatePostRequest {
  int64 user_id = 1;
  int64 id = 2;
  string title = 3;
  string slug = 4;
  string summary = 5;
  string content = 6;
  string cover = 7;
  string status = 8;
  int64 category_id = 9;
  int64 published_at = 10;
}

message CategoryItem {
  int64 id = 1;
  string name = 2;
  string slug = 3;
  int64 sort = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

message ListCategoriesResponse {
  repeated CategoryItem categories = 1;
}

message CreateCategoryRequest {
  int64 user_id = 1;
  string name = 2;
  string slug = 3;
  int64 sort = 4;
}

message CreateCategoryResponse {
  int64 id = 1;
}

message UpdateCategoryRequest {
  int64 user_id = 1;
  int64 id = 2;
  string name = 3;
  string slug = 4;
  int64 sort = 5;
}

message DeleteCategoryRequest {
  int64 user_id = 1;
  int64 id = 2;
}

message UploadImageRequest {
  int64 user_id = 1;
  string filename = 2;
  string content_type = 3;
  bytes content = 4;
}

message UploadImageResponse {
  string url = 1;
}
